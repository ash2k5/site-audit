[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-audit"
version = "1.0.0"
description = "Generate a structured PDF site audit from a URL for sales outreach."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashwin Santosh" }]
dependencies = [
    "groq>=0.11",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
site-audit = "site_audit.cli:main"

[tool.setuptools]
packages = ["site_audit"]
include-package-data = true

[tool.setuptools.package-data]
site_audit = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
