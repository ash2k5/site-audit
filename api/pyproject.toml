[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-audit"
version = "1.0.0"
description = "generate a website audit from a url"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashwin Santosh" }]
dependencies = [
    "groq>=0.11",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[project.scripts]
site-audit = "site_audit.cli:main"

[tool.setuptools]
packages = ["site_audit"]
include-package-data = true

[tool.setuptools.package-data]
site_audit = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# BeautifulSoup's .get() returns str/list/None unions; the HTML access is
# runtime-correct. Start lenient here and tighten later.
module = "site_audit.scraper"
disable_error_code = ["assignment", "misc", "union-attr", "type-var", "call-overload", "return-value"]

[[tool.mypy.overrides]]
# Groq's typed SDK rejects our plain-dict tool schema; the call is correct.
module = "site_audit.analyzer"
disable_error_code = ["call-overload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient warns about httpx; third-party deprecation, not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]
